<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍓 大钱袋 · 双人记账本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#e5436b; --accent2:#ff90ae; --accent-soft:#ffe3ea;
  --bg1:#ffe9f0; --bg2:#fff6f8;
  --text:#8a2f4d; --muted:#c07e97;
  --danger:#ff6b81;
  --income:#3ecf8e;
}
body.user-ganggang{ --accent:#4dabf7; --accent2:#8ec9ff; --accent-soft:#e3f2ff; --bg1:#eaf4ff; --bg2:#eefaff; --text:#2d5d8a; --muted:#85a8c8; }
body.user-both{ --accent:#b28dff; --accent2:#d3bdff; --accent-soft:#f0eaff; --bg1:#f4efff; --bg2:#fdefff; --text:#5d4a8a; --muted:#9f8fc9; }
body.user-settings{ --accent:#8a7aa8; --accent2:#b8a9d8; --accent-soft:#f0edf7; --bg1:#f2f0f8; --bg2:#faf9ff; --text:#5b5470; --muted:#9a92ad; }
body{
  font-family:'ZCOOL KuaiLe','YouYuan','Yuanti SC','Microsoft YaHei','PingFang SC',sans-serif;
  background:
    radial-gradient(circle at 25% 25%, rgba(255,255,255,.55) 6px, transparent 7px),
    radial-gradient(circle at 75% 75%, rgba(255,255,255,.55) 6px, transparent 7px),
    linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#fff);
  background-size:72px 72px,72px 72px,100% 100%;
  min-height:100vh;color:var(--text);
  padding:24px 16px 60px;
}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:8px;background:repeating-linear-gradient(45deg,#e5002b 0 16px,#fff 16px 32px);z-index:5;pointer-events:none}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;background:linear-gradient(135deg,var(--accent-soft),#ffffff 75%);border-radius:22px;padding:14px 18px;box-shadow:0 8px 24px rgba(180,120,150,.12)}
.title{font-size:27px;font-weight:800;color:var(--accent)}
.title .sub{font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}
.user-tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:18px;box-shadow:0 6px 18px rgba(180,120,150,.12)}
.user-tab{border:none;background:transparent;padding:9px 16px;border-radius:13px;font-size:15px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .2s}
.user-tab:hover{transform:translateY(-1px)}
.user-tab.active{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(180,120,150,.3);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.grid{display:grid;grid-template-columns:5fr 7fr;gap:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(180,120,150,.10);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card-title{font-size:16px;margin-bottom:14px;font-weight:700}
.amount-row{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:16px;padding:10px 16px;margin-bottom:14px}
.yen{font-size:22px;font-weight:700;color:var(--accent)}
#amountInput{flex:1;min-width:0;border:none;background:transparent;font-size:26px;font-weight:700;color:var(--text);outline:none;font-family:inherit}
#amountInput::placeholder{color:#d8c6cd}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:14px}
.cat-chip{border:none;border-radius:14px;padding:9px 4px;font-size:13px;cursor:pointer;background:#fff0f5;background:color-mix(in srgb,var(--cat) 14%,white);border:2px solid transparent;color:#6b5b62;font-family:inherit;transition:all .15s;white-space:nowrap}
.cat-chip:hover{transform:translateY(-2px)}
.cat-chip.active{border-color:var(--cat);background:#ffe4ee;background:color-mix(in srgb,var(--cat) 24%,white);font-weight:700;color:#4a3c42}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta-row input[type=date]{border:2px solid var(--accent-soft);border-radius:12px;padding:7px 10px;font-family:inherit;color:var(--text);outline:none;background:#fff;font-size:13px}
.note-input{width:100%;padding:11px 14px;border:2px solid var(--accent-soft);border-radius:14px;font-size:14px;outline:none;font-family:inherit;background:#fff;color:var(--text);margin-bottom:14px}
.note-input:focus{border-color:var(--accent)}
.note-input::placeholder{color:#d8c6cd}
.now-time b{color:var(--accent)}
.btn-primary{width:100%;padding:13px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(180,120,150,.3);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.btn-primary:hover{transform:scale(1.02)}
.btn-primary:active{transform:scale(.97)}
.btn-row{display:flex;gap:10px}
.btn-row .btn-primary{flex:1;width:auto}
.btn-ghost{padding:13px 18px;border:2px solid var(--accent-soft);border-radius:16px;background:#fff;color:var(--muted);font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-ghost:hover{color:var(--accent);border-color:var(--accent)}
.budget-nav,.rec-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.budget-nav button,.rec-nav button{border:none;background:var(--accent-soft);color:var(--accent);width:28px;height:28px;border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit}
.budget-nav button:hover,.rec-nav button:hover{transform:scale(1.08)}
.budget-nav button:disabled,.rec-nav button:disabled{opacity:.35;cursor:default;transform:none}
.budget-nav .lbl,.rec-nav .lbl{font-weight:700;font-size:15px}
.budget-row{display:flex;gap:8px;align-items:center}
.budget-row input{flex:1;min-width:0;padding:11px 14px;border:2px solid var(--accent-soft);border-radius:14px;font-size:15px;outline:none;font-family:inherit;background:#fff;color:var(--text)}
.budget-row input:focus{border-color:var(--accent)}
.btn-secondary{padding:11px 18px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}
.btn-secondary:hover{transform:scale(1.04)}
.btn-secondary:disabled{opacity:.4;cursor:default;transform:none}
.budget-info{margin-top:10px;font-size:13px;color:var(--muted)}
.budget-who{font-size:14px;font-weight:700;white-space:nowrap;min-width:76px}
.settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.settings-actions .btn-ghost{flex:1;min-width:120px}
.rec-list-row{}
.rec-row{display:flex;flex-direction:column;padding:10px 8px;border-bottom:1px dashed var(--accent-soft);font-size:13px;cursor:pointer;border-radius:10px;transition:background .15s}
.rec-row:hover{background:var(--accent-soft)}
.rec-main{display:flex;align-items:center;gap:10px}
.rec-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;word-break:break-all}
.rec-hint{font-size:11px;color:var(--muted);margin-bottom:6px}
.rec-user{font-size:12px;background:var(--accent-soft);padding:2px 8px;border-radius:8px}
.rec-cat{font-weight:700;white-space:nowrap}
.rec-date{color:var(--muted);font-size:12px;white-space:nowrap}
.rec-amt{margin-left:auto;font-weight:700;color:var(--danger);white-space:nowrap}
.rec-income{color:var(--income)}
.rec-del{border:none;background:#fbe9ee;color:#d16a80;width:24px;height:24px;border-radius:8px;cursor:pointer;flex-shrink:0}
.rec-del:hover{background:#ffd6de}
.rec-total{text-align:right;padding:10px 4px 2px;font-size:13px;color:var(--muted)}
.rec-total b{color:var(--accent);font-size:15px}
.rec-empty{color:var(--muted);text-align:center;padding:22px 0;font-size:13px}
.ov-main{display:flex;gap:20px;flex-wrap:wrap}
.ov-stat{min-width:110px}
.ov-label{font-size:13px;color:var(--muted)}
.ov-value{font-size:26px;font-weight:800;color:var(--accent);word-break:break-all}
.ov-value.ov-income{color:var(--income)}
.ov-value.pos{color:var(--income)}
.ov-value.neg{color:var(--danger)}
.ov-sub{font-size:12px;color:var(--muted)}
.ov-progress{width:100%;margin-top:16px}
.ov-budget-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.progress-track{height:14px;border-radius:10px;background:var(--accent-soft);overflow:hidden}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .5s ease}
.progress-fill.over{background:linear-gradient(90deg,#ff6b81,#ff9a9a)}
.ov-mini{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ov-mini b{color:var(--text)}
.ov-status{margin-top:14px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700}
.cmp-table{width:100%;border-collapse:collapse;font-size:14px}
.cmp-table th,.cmp-table td{padding:7px 6px;text-align:right;white-space:nowrap}
.cmp-table th:first-child,.cmp-table td:first-child{text-align:left}
.cmp-table th{color:var(--muted);font-weight:400;font-size:12px}
.cmp-table tr.tot td{border-top:1px dashed var(--accent-soft);font-weight:700}
.cmp-table td.neg{color:var(--danger)}
.cmp-table td.pos{color:var(--income)}
.cmp-cum-title{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.rec-subtotal{font-size:12px;color:var(--muted);margin-top:2px}
.rec-day{display:flex;align-items:center;gap:8px;margin:12px 0 2px;padding:5px 10px;background:var(--accent-soft);border-radius:10px;font-size:12px;font-weight:700;color:var(--text)}
.rec-day-sub{margin-left:auto;font-weight:400;color:var(--muted);font-size:11px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;border-radius:50%;position:relative;flex-shrink:0;background:#f0e6ea}
.donut-hole{position:absolute;inset:24px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center}
.dc-label{font-size:12px;color:var(--muted)}
.dc-value{font-size:17px;font-weight:700}
.legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:13px}
.leg-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.leg-name{min-width:64px}
.leg-amt{margin-left:auto;font-weight:700}
.leg-pct{color:var(--muted);width:48px;text-align:right}
.seg-tabs{display:inline-flex;gap:6px;background:var(--accent-soft);padding:5px;border-radius:14px;margin-bottom:14px}
.seg-tabs button{border:none;background:transparent;padding:8px 18px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .2s}
.seg-tabs button.active{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 3px 8px rgba(180,120,150,.15)}
.bars{display:flex;align-items:flex-end;gap:8px;height:210px;padding-top:10px;overflow-x:auto}
.bar-col{flex:1;min-width:34px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar-value{font-size:11px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.bar{width:70%;max-width:40px;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,var(--accent2),var(--accent));transition:height .5s ease;min-height:2px}
.bar.over{background:linear-gradient(180deg,#ff9a9a,#ff6b81)}
.bar-label{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.bar-budget{font-size:10px;color:var(--accent);margin-top:2px;white-space:nowrap}
.chart-note{margin-top:12px;font-size:13px;color:var(--muted)}
.chart-note b{color:var(--text)}
.advice-card{background:linear-gradient(135deg,var(--accent-soft),#fff)}
.advice-suggest{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(180,120,150,.12);flex-wrap:wrap}
.as-label{font-size:14px;font-weight:700}
.as-sub{font-size:11px;color:var(--muted);margin-top:3px}
.advice-big{font-size:30px;font-weight:800;color:var(--accent)}
.advice-tip{display:flex;gap:8px;margin:9px 0;font-size:14px;align-items:flex-start}
.advice-cheer{margin-top:12px;font-size:14px;color:var(--accent);font-weight:700}
.footer{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.footer button{border:none;background:#fff;color:var(--muted);padding:8px 16px;border-radius:12px;cursor:pointer;font-size:12px;box-shadow:0 4px 10px rgba(180,120,150,.08);font-family:inherit}
.footer button:hover{color:var(--accent)}
.footer .note{font-size:11px;color:#c4b2ba;text-align:center;width:100%}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#4a3c42;color:#fff;padding:12px 22px;border-radius:16px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loadErr{display:none;max-width:1080px;margin:0 auto 16px;background:#fff0f0;border:2px solid #ff6b81;color:#c0392b;border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.6;z-index:40}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.floaties span{position:absolute;font-size:26px;opacity:.14;animation:floaty 9s ease-in-out infinite}
.floaties svg{position:absolute;opacity:.12;animation:floaty 10s ease-in-out infinite}
.title{display:flex;align-items:center;gap:8px}
.title svg{width:30px;height:30px;flex-shrink:0}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#fff);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.gate-box{background:#fff;border-radius:24px;padding:32px 28px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(180,120,150,.18);text-align:center}
.gate-title{font-size:24px;font-weight:800;color:var(--accent);margin-bottom:6px}
.gate-sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.gate-box input{width:100%;padding:13px 16px;border:2px solid var(--accent-soft);border-radius:14px;font-size:15px;outline:none;font-family:inherit;color:var(--text);margin-bottom:12px;text-align:center}
.gate-box input:focus{border-color:var(--accent)}
.gate-box button{width:100%;padding:13px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.gate-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-title">🍓 齐齐和刚刚的小金库</div>
    <div class="gate-sub">请输入登陆密码进入</div>
    <input type="password" id="codeInput" placeholder="请输入密码" autocomplete="off">
    <button id="enterBtn">进入账本 →</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><symbol id="kitty" viewBox="0 0 200 200">
  <path d="M40 50 L30 8 L72 28 Z" fill="#ffffff" stroke="#e8c7d0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M160 50 L170 8 L128 28 Z" fill="#ffffff" stroke="#e8c7d0" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="100" cy="118" rx="74" ry="62" fill="#ffffff" stroke="#e8c7d0" stroke-width="3"/>
  <ellipse cx="71" cy="110" rx="6.5" ry="9" fill="#3b3b3b"/>
  <ellipse cx="129" cy="110" rx="6.5" ry="9" fill="#3b3b3b"/>
  <ellipse cx="100" cy="128" rx="9" ry="6.5" fill="#ffd23e" stroke="#f0b429" stroke-width="1.5"/>
  <g stroke="#a8a8a8" stroke-width="3" stroke-linecap="round">
    <line x1="26" y1="98" x2="60" y2="106"/>
    <line x1="23" y1="120" x2="60" y2="120"/>
    <line x1="26" y1="142" x2="60" y2="134"/>
    <line x1="174" y1="98" x2="140" y2="106"/>
    <line x1="177" y1="120" x2="140" y2="120"/>
    <line x1="174" y1="142" x2="140" y2="134"/>
  </g>
  <path d="M156 20 L132 10 L142 36 Z" fill="#e5002b"/>
  <path d="M156 20 L180 10 L170 36 Z" fill="#e5002b"/>
  <circle cx="156" cy="20" r="7.5" fill="#ff2d55"/>
</symbol></svg>
<div class="floaties">
  <svg style="top:6%;left:5%;width:150px;animation-delay:0s" viewBox="0 0 200 200"><use href="#kitty"/></svg>
  <svg style="top:55%;left:88%;width:110px;animation-delay:1.4s" viewBox="0 0 200 200"><use href="#kitty"/></svg>
  <svg style="top:70%;left:6%;width:170px;animation-delay:2.4s" viewBox="0 0 200 200"><use href="#kitty"/></svg>
  <span style="top:10%;left:82%;animation-delay:1s">🎀</span>
  <span style="top:32%;left:92%;animation-delay:2s">🌸</span>
  <span style="top:48%;left:3%;animation-delay:.6s">🍎</span>
  <span style="top:86%;left:55%;animation-delay:1.8s">🎀</span>
  <span style="top:20%;left:40%;animation-delay:2.8s">🍒</span>
  <span style="top:64%;left:48%;animation-delay:1.1s">🌸</span>
</div>
<div class="wrap">
  <div id="loadErr"></div>
  <header class="top">
    <div class="title"><svg viewBox="0 0 200 200"><use href="#kitty"/></svg>大钱袋<span class="sub">小齐齐 &amp; 大刚刚 的可爱记账本</span></div>
    <div class="user-tabs">
      <button class="user-tab active" data-user="qiqi">🐰 小齐齐</button>
      <button class="user-tab" data-user="ganggang">🐻 大刚刚</button>
      <button class="user-tab" data-user="both">👫 两人合计</button>
      <button class="user-tab" data-user="settings">⚙️ 设置</button>
    </div>
  </header>

  <div class="grid" id="mainGrid">
    <div class="col">
      <div class="card" id="addCard">
        <h2 class="card-title">✏️ 记一笔</h2>
        <div class="seg-tabs" id="typeTabs">
          <button data-type="expense" class="active">💸 支出</button>
          <button data-type="income">💰 收入</button>
        </div>
        <div class="amount-row"><span class="yen">¥</span><input type="number" id="amountInput" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal"></div>
        <div class="cat-grid" id="catGrid"></div>
        <input type="text" id="noteInput" class="note-input" placeholder="备注（可不填）：买了什么、和谁一起…" maxlength="50">
        <div class="meta-row">
          <span>📅 <input type="date" id="dateInput"></span>
          <span class="now-time">🕐 现在 <b id="nowTime">--:--:--</b></span>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="addBtn">记下这笔 ✨</button>
          <button class="btn-ghost" id="editCancel" style="display:none">✕ 取消</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">📒 账单明细</h2>
        <div class="rec-nav">
          <button id="prevMonth">◀</button><span class="lbl" id="recMonthLabel"></span><button id="nextMonth">▶</button>
        </div>
        <div class="rec-hint">💡 点击账单可修改，点 ✕ 可删除</div>
        <div id="recList"></div>
      </div>
    </div>

    <div class="col">
      <div class="card" id="cmpCard" style="display:none">
        <h2 class="card-title">👫 两人对比</h2>
        <div class="seg-tabs" id="cmpScopeTabs">
          <button data-scope="today">📅 今日</button>
          <button data-scope="month" class="active">🗓️ 本月</button>
          <button data-scope="year">📆 今年</button>
        </div>
        <table class="cmp-table" id="cmpTable"></table>
        <div class="cmp-cum-title">💰 累计（从记账以来）</div>
        <table class="cmp-table" id="cmpCumTable"></table>
      </div>
      <div class="card">

}

async function loadFromServer(){
  const [rr,br]=await Promise.all([
    client.from('records').select('*').eq('ledger_code',ledgerCode),
    client.from('budgets').select('*').eq('ledger_code',ledgerCode)
  ]);
  if(rr.error) throw rr.error;
  if(br.error) throw br.error;
  const s={qiqi:{records:[],budgets:{}},ganggang:{records:[],budgets:{}}};
  (rr.data||[]).forEach(r=>{
    const u=s[r.uid==='ganggang'?'ganggang':'qiqi'];
    u.records.push({id:String(r.id),amount:Number(r.amount),cat:r.cat,type:r.type,date:r.date,time:String(r.time||''),note:String(r.note||''),ts:Number(r.ts)});
  });
  (br.data||[]).forEach(b=>{
    const u=s[b.uid==='ganggang'?'ganggang':'qiqi'];
    u.budgets[b.month]=Number(b.amount);
  });
  state=sanitize(s);
}
function sanitize(s){
  const fix=u=>{
    u.records=(u.records||[]).filter(r=>r&&typeof r.amount==='number'&&isFinite(r.amount)&&r.amount>0).map(r=>({
      id:String(r.id||Math.random()),
      amount:Math.round(r.amount*100)/100,
      cat:CAT_MAP[r.cat]?r.cat:(r.type==='income'?'other_income':'other'),
      type:r.type==='income'?'income':'expense',
      date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:dkey(new Date()),
      time:String(r.time||''),
      note:typeof r.note==='string'?r.note.slice(0,50):'',
      ts:Number(r.ts)||Date.now()
    }));
    const rb=u.budgets&&typeof u.budgets==='object'?u.budgets:{};
    const nb={};
    Object.keys(rb).forEach(k=>{ const v=Number(rb[k]); if(isFinite(v)&&v>=0) nb[k]=Math.round(v*100)/100; });
    u.budgets=nb;
  };
  fix(s.qiqi); fix(s.ganggang);
  return s;
}

function isIncome(r){ return r.type==='income'; }
function monthExpense(uid,mk){ return userRecords(uid).filter(r=>!isIncome(r)&&r.date.slice(0,7)===mk).reduce((s,r)=>s+r.amount,0); }

function allExpense(uid){ return userRecords(uid).filter(r=>!isIncome(r)).reduce((s,r)=>s+r.amount,0); }
function allIncome(uid){ return userRecords(uid).filter(r=>isIncome(r)).reduce((s,r)=>s+r.amount,0); }
function monthByCat(uid,mk){
  const map={};
  userRecords(uid).filter(r=>!isIncome(r)&&r.date.slice(0,7)===mk).forEach(r=>{ map[r.cat]=(map[r.cat]||0)+r.amount; });
  return CATS.filter(c=>map[c.id]).map(c=>({id:c.id,name:c.name,emoji:c.emoji,color:c.color,total:map[c.id]})).sort((a,b)=>b.total-a.total);
}
function monthByInCat(uid,mk){
  const map={};
  userRecords(uid).filter(r=>isIncome(r)&&r.date.slice(0,7)===mk).forEach(r=>{ map[r.cat]=(map[r.cat]||0)+r.amount; });
  return INCATS.filter(c=>map[c.id]).map(c=>({id:c.id,name:c.name,emoji:c.emoji,color:c.color,total:map[c.id]})).sort((a,b)=>b.total-a.total);
}

    time:pad(now.getHours())+':'+pad(now.getMinutes()),
    note:String(note||'').trim().slice(0,50),

}

function cmpVal(uid,type,scope){
  const exp=scope.dk?dayExpense(uid,scope.dk):(scope.mk?monthExpense(uid,scope.mk):yearExpense(uid,scope.y));
  const inc=scope.dk?dayIncome(uid,scope.dk):(scope.mk?monthIncome(uid,scope.mk):yearIncome(uid,scope.y));
  if(type==='income') return inc;
  if(type==='balance') return inc-exp;
  return exp;
}
function cmpBar(v,max,type){

  return {h:mag>0?Math.max(mag/max*100,3):0, val:v!==0?fmtCompact(v):'', neg:type==='balance'&&v<0};
}

    arr.push({label:i===0?'今天':WEEKDAYS[d.getDay()],title:dkey(d),total:t});
    total7+=t;

  let prev7=0;
  for(let i=13;i>=7;i--){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    prev7+=cmpVal(currentUser,compareType,{dk:dkey(d)});
  }
  const max=Math.max.apply(null,arr.map(x=>Math.abs(x.total)).concat([1]));
  el('bars').innerHTML=arr.map(x=>{
    const b=cmpBar(x.total,max,compareType);
    return '<div class="bar-col" title="'+x.title+'：¥'+fmt(x.total)+'"><div class="bar-value">'+b.val+'</div><div class="bar'+(b.neg?' over':'')+'" style="height:'+b.h+'%"></div><div class="bar-label">'+x.label+'</div></div>';
  }).join('');
  const tn=compareType==='income'?'收入':(compareType==='balance'?'结余':'支出');
  let note='近7天'+tn+' <b>¥'+fmt(total7)+'</b>';
  if(prev7>0){
    const d=total7-prev7;
    note+=' · 较前7天 '+(d>=0?'↑':'↓')+' '+(Math.abs(d)/prev7*100).toFixed(0)+'%';
  }
  const top=arr.reduce((a,b)=>b.total>a.total?b:a,arr[0]);
  if(top.total>0) note+=' · 最高：'+top.label+' ¥'+fmt(top.total);
  el('chartNote').innerHTML=note;
}
function renderMonthBars(){

  const months=[];
  for(let i=11;i>=0;i--){
    const d=addMonths(now,-i);
    months.push({mk:mkey(d),label:(d.getMonth()+1)+'月',isNow:i===0});
  }
  const isExp=compareType==='expense';
  months.forEach(m=>{ m.total=cmpVal(currentUser,compareType,{mk:m.mk}); m.budget=isExp?getBudget(currentUser,m.mk):0; });
  const max=Math.max.apply(null,months.map(m=>Math.max(Math.abs(m.total),m.budget)).concat([1]));
  const tn=compareType==='income'?'收入':(compareType==='balance'?'结余':'支出');
  el('bars').innerHTML=months.map(m=>{
    const b=cmpBar(m.total,max,compareType);
    const over=isExp&&m.budget>0&&m.total>m.budget;
    return '<div class="bar-col" title="'+m.mk+'：'+tn+' ¥'+fmt(m.total)+(m.budget>0?' · 预算 ¥'+fmt(m.budget):'')+'">'
      +'<div class="bar-value">'+b.val+'</div>'
      +'<div class="bar'+((b.neg||over)?' over':'')+'" style="height:'+b.h+'%"></div>'
      +'<div class="bar-label"'+(m.isNow?' style="color:var(--accent);font-weight:700"':'')+'>'+m.label+'</div>'
      +(m.budget>0?'<div class="bar-budget">预 ¥'+fmtCompact(m.budget)+'</div>':'')
      +'</div>';
  }).join('');
  const total=cmpVal(currentUser,compareType,{mk:mkey(now)});
  const last=cmpVal(currentUser,compareType,{mk:mkey(addMonths(now,-1))});
  let note='本月'+tn+' <b>¥'+fmt(total)+'</b>';
  if(last>0){
    const d=total-last;
    note+=' · 较上月 '+(d>=0?'↑':'↓')+' '+(Math.abs(d)/last*100).toFixed(0)+'%';
  }
  const yInc=yearIncome(currentUser,now.getFullYear()), yExp=yearExpense(currentUser,now.getFullYear());
  const yTot=compareType==='income'?yInc:(compareType==='balance'?yInc-yExp:yExp);
  note+=' · 今年累计 <b>¥'+fmt(yTot)+'</b>';
  if(isExp) note+=' <span>（红色柱 = 超预算）</span>';
  else if(compareType==='balance') note+=' <span>（红色柱 = 结余为负）</span>';
  el('chartNote').innerHTML=note;
}
function renderYearBars(){
  const years=[];
  userRecords(currentUser).forEach(r=>{
    const y=r.date.slice(0,4);
    if(years.indexOf(y)<0) years.push(y);
  });
  years.sort();
  const rows=years.map(y=>({y:y,total:cmpVal(currentUser,compareType,{y:+y})}));
  if(!rows.length){
    el('bars').innerHTML='<div class="rec-empty" style="width:100%">还没有跨年度的数据，先去记账吧 🐣</div>';
    el('chartNote').textContent='';
    return;
  }
  const max=Math.max.apply(null,rows.map(r=>Math.abs(r.total)).concat([1]));
  el('bars').innerHTML=rows.map((r,i)=>{
    const b=cmpBar(r.total,max,compareType);
    let yoy='';
    if(compareType!=='balance'&&i>0&&rows[i-1].total>0){
      const d=r.total-rows[i-1].total;
      yoy='<div class="bar-budget">'+(d>=0?'↑':'↓')+(Math.abs(d)/rows[i-1].total*100).toFixed(0)+'%</div>';
    }
    return '<div class="bar-col" title="'+r.y+'年：¥'+fmt(r.total)+'"><div class="bar-value">'+b.val+'</div><div class="bar'+(b.neg?' over':'')+'" style="height:'+b.h+'%"></div><div class="bar-label">'+r.y+'年</div>'+yoy+'</div>';
  }).join('');
  const cur=rows[rows.length-1], prev=rows.length>1?rows[rows.length-2]:null;
  const tn=compareType==='income'?'收入':(compareType==='balance'?'结余':'支出');
  let note='<b>'+cur.y+'</b>年至今'+tn+' <b>¥'+fmt(cur.total)+'</b>';
  if(prev&&prev.total>0&&compareType!=='balance'){
    const d=cur.total-prev.total;
    note+=' · 较'+prev.y+'年 '+(d>=0?'↑':'↓')+' '+(Math.abs(d)/prev.total*100).toFixed(0)+'%';
  }
  el('chartNote').innerHTML=note;
}

function pickCheer(uid){
  const n=new Date();
  const salt=uid==='qiqi'?0:(uid==='ganggang'?1:2);
  return CHEERS[(n.getFullYear()*372+n.getMonth()*31+n.getDate()+salt)%CHEERS.length];
}
function genAdvice(uid){
  const now=new Date();
  const mk=mkey(now), lk=mkey(addMonths(now,-1)), l2k=mkey(addMonths(now,-2));
  const total=monthExpense(uid,mk), last=monthExpense(uid,lk), last2=monthExpense(uid,l2k);
  const income=monthIncome(uid,mk);
  const budget=getBudget(uid,mk);
  const cats=monthByCat(uid,mk), lastCats=monthByCat(uid,lk);
  const name=uid==='both'?'两位':(uid==='qiqi'?'小齐齐':'大刚刚');
  const cheer=pickCheer(uid);
  if(total===0&&last===0&&income===0){
    const nb=getBudget(uid,mkey(addMonths(now,1)));
    return {suggested:nb>0?nb:2000,tips:[{emoji:'🐣',text:name+'还没有什么记账记录，先记几笔，下个月就能给出靠谱建议啦～'}],cheer:cheer};
  }
  const tips=[];
  if(budget>0){
    if(total>budget) tips.push({emoji:'😱',text:'本月实际支出 ¥'+fmt(total)+'，超出预算 ¥'+fmt(total-budget)});
    else tips.push({emoji:'🎉',text:'本月支出 ¥'+fmt(total)+'，控制在预算内，结余 ¥'+fmt(budget-total)});
  }else{
    tips.push({emoji:'🎯',text:'本月还没设置预算，设置后就能和实际支出对比了哦'});
  }
  if(income>0){
    tips.push({emoji:'💰',text:'本月收入 ¥'+fmt(income)});
    const bal=income-total;
    if(bal>0) tips.push({emoji:'🏦',text:'本月结余 ¥'+fmt(bal)+'，可以考虑存起来哦'});
    else if(bal<0) tips.push({emoji:'⚠️',text:'本月入不敷出 ¥'+fmt(-bal)+'，下个月注意控制哦'});
  }
  if(uid==='both'){
    const a=monthExpense('qiqi',mk), b=monthExpense('ganggang',mk);
    if(a>0||b>0) tips.push({emoji:'⚖️',text:'本月 小齐齐 ¥'+fmt(a)+' · 大刚刚 ¥'+fmt(b)});
  }
  if(last>0){
    const diff=total-last;
    if(diff>0) tips.push({emoji:'📈',text:'本月比上月多花 ¥'+fmt(diff)+'（+'+(diff/last*100).toFixed(0)+'%）'});
    else if(diff<0) tips.push({emoji:'📉',text:'本月比上月节省 ¥'+fmt(-diff)+'（-'+(Math.abs(diff)/last*100).toFixed(0)+'%），继续保持！'});
  }
  const dom=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const daily=total/Math.max(1,now.getDate());
  if(daily>0&&now.getDate()>=3) tips.push({emoji:'🔮',text:'本月日均 ¥'+fmt(daily)+'，照这个节奏月底预计约 ¥'+fmt(daily*dom)});
  if(cats.length){
    const top=cats[0];
    const share=top.total/total;
    if(share>=0.4) tips.push({emoji:top.emoji,text:'「'+top.name+'」占本月支出 '+(share*100).toFixed(0)+'%，是支出大头，建议下月重点关注'});
  }
  let maxRise=null;
  cats.forEach(c=>{
    const prev=lastCats.find(p=>p.id===c.id);
    const prevT=prev?prev.total:0;
    const rise=c.total-prevT;
    if(prevT>0&&rise>0&&(!maxRise||rise>maxRise.rise)) maxRise={c:c,rise:rise};
  });
  if(maxRise) tips.push({emoji:'⚠️',text:'「'+maxRise.c.name+'」比上月多花 ¥'+fmt(maxRise.rise)+'，注意控制哦'});
  const vals=[total,last,last2].filter(v=>v>0);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  let suggested=round100(avg);
  if(budget>0&&total>budget) suggested=Math.max(suggested,round100(budget*1.05));
  const nb=getBudget(uid,mkey(addMonths(now,1)));
  if(nb>0) tips.push({emoji:'📝',text:'已为下个月设好预算 ¥'+fmt(nb)+'，记得对照执行哦'});
  tips.push({emoji:'💡',text:'参考最近 3 个月平均支出，建议下月预算 ¥'+fmt(suggested)});
  return {suggested:suggested,tips:tips.slice(0,6),cheer:cheer};
}

function renderRecords(){
  el('recMonthLabel').textContent=recordsMonth.replace('-','年')+'月';
  el('nextMonth').disabled=recordsMonth>=mkey(new Date());
  const recs=userRecords(currentUser).filter(r=>r.date.slice(0,7)===recordsMonth)
    .sort((a,b)=>b.date===a.date?(b.ts-a.ts):(b.date<a.date?-1:1));
  const inc=recs.filter(isIncome).reduce((s,r)=>s+r.amount,0);
  const exp=recs.reduce((s,r)=>s+r.amount,0)-inc;
  const bal=inc-exp;
  let subHtml='';
  if(currentUser==='both'){
    ['qiqi','ganggang'].forEach(u=>{
      const rs=recs.filter(r=>r.uid===u);
      const i=rs.filter(isIncome).reduce((s,r)=>s+r.amount,0);
      const e=rs.reduce((s,r)=>s+r.amount,0)-i;
      subHtml+='<div class="rec-subtotal">'+(u==='qiqi'?'🐰 齐齐':'🐻 刚刚')+' 收入 <b style="color:var(--income)">+¥'+fmt(i)+'</b> · 支出 <b style="color:var(--danger)">−¥'+fmt(e)+'</b></div>';
    });
  }
  const budget=getBudget(currentUser,recordsMonth);
  const budgetTxt=budget>0
    ?' · 预算 <b style="color:var(--accent)">¥'+fmt(budget)+'</b>'+(exp>budget?'，超支 <b style="color:var(--danger)">¥'+fmt(exp-budget)+'</b>':'，剩余 <b style="color:var(--income)">¥'+fmt(budget-exp)+'</b>')
    :' · 未设预算';
  // 默认折叠成一行摘要，点「展开」才显示按日分组的完整明细
  if(!recordsExpanded){
    el('recList').innerHTML=recs.length
      ?'<div class="rec-total" style="text-align:left">共 '+recs.length+' 笔 · 收入 <b style="color:var(--income)">+¥'+fmt(inc)+'</b> · 支出 <b style="color:var(--danger)">−¥'+fmt(exp)+'</b> · 结余 <b style="color:'+(bal>=0?'var(--income)':'var(--danger)')+'">'+(bal<0?'−':'')+'¥'+fmt(Math.abs(bal))+'</b>'+budgetTxt+'</div>'
        +'<button class="btn-ghost" id="recExpandBtn" style="width:100%;margin-top:8px">📜 展开账单明细（'+recs.length+' 笔）</button>'
      :'<div class="rec-empty">这个月还没有账单哦 🐣</div>';
    const eb=el('recExpandBtn');
    if(eb) eb.addEventListener('click',()=>{ recordsExpanded=true; renderRecords(); });
    return;
  }

  // 展开：按「日」分组渲染，每天一个日期标题（当天支出/收入）
  const days=[];
  recs.forEach(r=>{
    const last=days[days.length-1];
    if(!last||last.date!==r.date) days.push({date:r.date,list:[]});
    days[days.length-1].list.push(r);
  });
  let body='';
  days.forEach(d=>{
    const p=d.date.split('-').map(Number);
    const wd=WEEKDAYS[new Date(p[0],p[1]-1,p[2]).getDay()];
    let de=0, di=0, nExp=0;
    d.list.forEach(r=>{ if(isIncome(r)) di+=r.amount; else{ de+=r.amount; nExp++; } });
    const parts=[];
    if(nExp>0) parts.push(nExp+' 笔支出');
    if(de>0) parts.push('支出 −¥'+fmt(de));
    if(di>0) parts.push('收入 +¥'+fmt(di));
    const sub=parts.join(' · ');
    body+='<div class="rec-day"><span>'+p[1]+'月'+p[2]+'日 '+wd+'</span>'+(sub?'<span class="rec-day-sub">'+sub+'</span>':'')+'</div>';
    d.list.forEach(r=>{
      const isInc=isIncome(r);
      const c=CAT_MAP[r.cat]||CAT_MAP[isInc?'other_income':'other'];
      const who=currentUser==='both'?'<span class="rec-user">'+(r.uid==='qiqi'?'🐰 齐齐':'🐻 刚刚')+'</span>':'';
      const note=r.note?'<div class="rec-note">'+esc(r.note)+'</div>':'';
      body+='<div class="rec-row" data-id="'+esc(r.id)+'" data-uid="'+esc(r.uid)+'">'
        +'<div class="rec-main">'+who
        +'<span class="rec-cat">'+c.emoji+' '+c.name+'</span>'
        +'<span class="rec-date">'+esc(r.time||'')+'</span>'
        +'<span class="rec-amt'+(isInc?' rec-income':'')+'">'+(isInc?'+':'-')+'¥'+fmt(r.amount)+'</span>'
        +((canEditUid(r.uid)&&currentUser!=='both')?'<button class="rec-del" data-id="'+esc(r.id)+'" data-uid="'+esc(r.uid)+'">✕</button>':'')+'</div>'
        +note
        +'</div>';
    });
  });
  el('recList').innerHTML='<button class="btn-ghost" id="recCollapseBtn" style="width:100%;margin-bottom:8px">▴ 收起账单明细</button>'
    +(recs.length?body+'<div class="rec-total">'+subHtml+'<div>收入 <b style="color:var(--income)">+¥'+fmt(inc)+'</b> · 支出 <b style="color:var(--danger)">−¥'+fmt(exp)+'</b> · 结余 <b style="color:'+(bal>=0?'var(--income)':'var(--danger)')+'">'+(bal<0?'−':'')+'¥'+fmt(Math.abs(bal))+'</b>（'+recs.length+' 笔）'+budgetTxt+'</div></div>':'<div class="rec-empty">这个月还没有账单哦 🐣</div>');
  const cb=el('recCollapseBtn');
  if(cb) cb.addEventListener('click',()=>{ recordsExpanded=false; renderRecords(); });
  document.querySelectorAll('#recList .rec-row').forEach(row=>{
    row.addEventListener('click',()=>startEdit(row.dataset.uid,row.dataset.id));
  });
  document.querySelectorAll('#recList .rec-del').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!canEditUid(b.dataset.uid)){ toast('只能删除自己的账单哦','🙈'); return; }
    if(confirm('要删掉这笔记录吗？')){
      try{
        await deleteRecord(b.dataset.uid,b.dataset.id);
        await loadFromServer();
        renderAll();
        toast('已删除','🗑️');
      }catch(err){ console.error(err); toast('删除失败，请检查网络','⚠️'); }
    }
  }));
}

  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

    const note=el('noteInput').value.trim();
    const rec=buildRecord(uid,amt,savedCat,date,savedType,note);

    // 乐观更新：先在本地入账、立即渲染，后台再同步云端，慢网下也不再卡住
    state[uid].records.push(rec);
    el('amountInput').value='';
    el('noteInput').value='';
    renderAll();
    setSaving();
    try{
      await addRecord(uid,rec);
      if(savedType==='income') toast('收入记好啦！'+CAT_MAP[savedCat].emoji+' +¥'+fmt(amt),'✅');
      else toast('记好啦！'+CAT_MAP[savedCat].emoji+' ¥'+fmt(amt),'✅');
    }catch(e){
      console.error(e);
      state[uid].records=state[uid].records.filter(x=>x.id!==rec.id);
      renderAll();
      toast('保存失败，请检查网络（这条已撤销）','⚠️');
    }
    restore();
  });
  el('editCancel').addEventListener('click',cancelEdit);
  el('amountInput').addEventListener('keydown',e=>{ if(e.key==='Enter') el('addBtn').click(); });

  function bindBudget(uid,inputId,btnId){
    el(btnId).addEventListener('click',async()=>{
      if(!canEditUid(uid)){ toast('只能设置自己的预算哦','🙈'); return; }
      const v=parseFloat(el(inputId).value);
      if(!(v>=0)){ toast('请输入正确的预算金额','🙈'); return; }
      try{
        if(v===0){ await clearBudget(uid,budgetMonth); toast('已清除该月预算','🧹'); }
        else{ await setBudget(uid,budgetMonth,Math.round(v*100)/100); toast(budgetMonth.replace('-','年')+'月 预算已保存','🎯'); }
        await loadFromServer();
        renderAll();
      }catch(e){ console.error(e); toast('保存失败，请检查网络','⚠️'); }
    });
  }
  bindBudget('qiqi','budgetInputQiqi','budgetBtnQiqi');
  bindBudget('ganggang','budgetInputGanggang','budgetBtnGanggang');

  el('prevMonth').addEventListener('click',()=>{ recordsMonth=shiftMonthKey(recordsMonth,-1); renderRecords(); });
  el('nextMonth').addEventListener('click',()=>{ recordsMonth=shiftMonthKey(recordsMonth,1); renderRecords(); });
  el('budgetPrev').addEventListener('click',()=>{ budgetMonth=shiftMonthKey(budgetMonth,-1); renderBudget(); });
  el('budgetNext').addEventListener('click',()=>{ budgetMonth=shiftMonthKey(budgetMonth,1); renderBudget(); });
  el('distPrev').addEventListener('click',()=>{ distMonth=shiftMonthKey(distMonth,-1); renderDonut(); });
  el('distNext').addEventListener('click',()=>{ distMonth=shiftMonthKey(distMonth,1); renderDonut(); });

  el('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='大钱袋备份-'+dkey(new Date())+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('数据已导出','📦');
  });
  el('importBtn').addEventListener('click',()=>el('importInput').click());
  el('importInput').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const s=JSON.parse(r.result);
        if(s&&s.qiqi&&s.ganggang){
          if(!confirm('导入会覆盖当前所有数据，确定吗？')) return;
          await clearAll();
          const clean=sanitize(s);
          const recRows=[],budRows=[];
          ['qiqi','ganggang'].forEach(uid=>{
            clean[uid].records.forEach(x=>recRows.push({id:String(x.id),ledger_code:ledgerCode,uid:uid,amount:x.amount,cat:x.cat,type:x.type,date:x.date,time:x.time||'',note:x.note||'',ts:x.ts}));
            Object.keys(clean[uid].budgets).forEach(mk=>budRows.push({ledger_code:ledgerCode,uid:uid,month:mk,amount:clean[uid].budgets[mk]}));
          });
          if(recRows.length) await client.from('records').insert(recRows);
          if(budRows.length) await client.from('budgets').insert(budRows);
          await loadFromServer();
          renderAll();
          toast('导入成功','📥');
        }else{ toast('文件格式不对哦','🙈'); }
      }catch(err){ console.error(err); toast('文件解析或上传失败','🙈'); }
    };
    r.readAsText(f);
  });
  el('clearBtn').addEventListener('click',async()=>{
    if(!confirm('确定要清空所有记账数据吗？')) return;
    if(!confirm('再确认一次：清空后无法恢复哦！')) return;
    try{
      await clearAll();
      await loadFromServer();
      renderAll();
      toast('已清空，重新开始吧','🧹');
    }catch(e){ console.error(e); toast('清空失败，请检查网络','⚠️'); }
  });
}
function showGate(){ el('gate').style.display='flex'; }
function hideGate(){ el('gate').style.display='none'; }
async function bootstrap(){
  init(); // 先接好所有按钮/标签页的点击事件，保证页面始终可点（即使数据加载失败也不会卡死）
  if(!client){
    const m='Supabase 组件没加载成功：请确认 supabase.js 已和网页文件一起部署到同一目录，然后刷新重试';
    console.error(m);
    showLoadError(m);
    return;
  }
  try{
    await loadFromServer();
    renderAll();
    hideGate();
    setupRealtime();
  }catch(err){
    console.error(err);
    const m=String((err&&err.message)||err||'');
    let msg;
    if(/does not exist|relation|42P01|Could not find/i.test(m)){
      msg='数据表还没建好：请到 Supabase 控制台 → SQL Editor 运行 supabase-setup.sql，再回来试';
    }else if(/fetch|network|abort|timed out|ECONN|Failed to/i.test(m)){
      msg='连不上云端服务器：请确认 Supabase 项目仍存在（未删除/未暂停），并核对文件里的 SUPABASE_URL 是否正确；也可能是网络问题';
    }else{
      msg='加载失败：'+m;
    }
    showLoadError(msg);
  }
}
function showLoadError(msg){
  renderAll();
  const box=el('loadErr');
  if(box){ box.style.display='block'; box.textContent='⚠️ '+msg; }
  if(USE_PASSWORD){ showGate(); el('gateErr').textContent=msg; }
  else { toast(msg,'⚠️'); }
}
function setupRealtime(){
  try{
    client.channel('ledger-'+ledgerCode)
      .on('postgres_changes',{event:'*',schema:'public',table:'records'},()=>{ refreshQuiet(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'budgets'},()=>{ refreshQuiet(); })
      .subscribe();
  }catch(e){ console.error(e); }
}
async function refreshQuiet(){ try{ await loadFromServer(); renderAll(); }catch(e){} }
el('enterBtn').addEventListener('click',async()=>{
  const pwd=el('codeInput').value.trim();
  if(!pwd){ el('gateErr').textContent='请输入密码'; return; }
  const who=USER_PASSWORDS[pwd];
  if(!who){ el('gateErr').textContent='密码不对哦，再试一次'; return; }
  loginUser=who;
  currentUser=who;
  ledgerCode=FIXED_LEDGER_CODE;
  storage.set(LS_CODE,who);
  el('gateErr').textContent='';
  const btn=el('enterBtn');
  btn.disabled=true; btn.textContent='正在进入…';
  await bootstrap();
  btn.disabled=false; btn.textContent='进入账本 →';
});
el('codeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') el('enterBtn').click(); });
el('switchBtn').addEventListener('click',()=>{
  if(confirm('要退出登录吗？（下次打开需要重新输入密码，云端数据不会丢）')){
    storage.remove(LS_CODE);
    location.reload();
  }
});
(function start(){
  if(!USE_PASSWORD){
    el('switchBtn').style.display='none';
    ledgerCode=FIXED_LEDGER_CODE;
    hideGate();
    bootstrap();
    return;
  }
  const saved=storage.get(LS_CODE);
  if(USERS.indexOf(saved)>=0){ loginUser=saved; currentUser=saved; ledgerCode=FIXED_LEDGER_CODE; hideGate(); bootstrap(); }
  else showGate();
})();
</script>
</body>
</html>
